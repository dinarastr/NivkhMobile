#Gradle - Optimized for Android Studio IDE performance
org.gradle.jvmargs=-Xmx6144M -XX:MaxMetaspaceSize=1024M -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.daemon=true
org.gradle.workers.max=4

# Reduce IDE memory pressure
org.gradle.unsafe.configuration-cache=true
org.gradle.unsafe.configuration-cache.max-problems=0

# Kotlin daemon settings - prevent IDE memory leaks
kotlin.daemon.jvmargs=-Xmx3072M -XX:MaxMetaspaceSize=640M -XX:+HeapDumpOnOutOfMemoryError -XX:+UseG1GC
kotlin.compiler.execution.strategy=daemon
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true
kotlin.build.report.output=file

#Kotlin
kotlin.code.style=official

# Kotlin IDE optimizations - reduce indexing load
kotlin.incremental.multiplatform=true
kotlin.mpp.androidSourceSetLayoutVersion=2
kotlin.native.ignoreDisabledTargets=true

#Compose
org.jetbrains.compose.experimental.uikit.enabled=true

#Android - Reduce IDE processing
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false
android.enableR8.fullMode=true
android.experimental.enableSourceSetPathsMap=true
android.builder.sdkDownload=true

# Reduce Android Studio indexing load
android.disableResourceValidation=true

#MPP
kotlin.mpp.enableCInteropCommonization=true
kotlin.mpp.stability.nowarn=true